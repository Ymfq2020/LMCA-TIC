name: negative_random_icews14
dataset_name: ICEWS14
raw_dir: data/local/icews14/raw
processed_dir: data/processed/icews14
bie_path: data/local/icews14/bie/entity_metadata.jsonl
bie_ordered_keys: [entity_type, country, sector, city, region, role, alias, description]
ontology_keys: [entity_type, country]
delimiter: "\t"
output_dir: outputs/negative_random_icews14
log_dir: logs/negative_random_icews14
checkpoint_dir: checkpoints/negative_random_icews14
metadata:
  variant: LMCA-TIC-S
model:
  llm_name: Qwen/Qwen3-8B
  embedding_dim: 200
  time_encoding_dim: 64
  tgn_neighbor_size: 10
  tgn_time_window_days: 14
  tgn_memory_dim: 200
  fusion_hidden_dim: 128
  use_llm: true
  use_temporal: true
  use_tgn: true
  use_gate: true
  use_4bit: true
negative_sampling:
  mode: random_uniform
  k_recall: 256
  n_neg: 256
  tau: 0.5
  alpha: 0.2
  rho: 0.0
